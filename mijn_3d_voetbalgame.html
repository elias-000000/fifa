<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn 3D Voetbalgame</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#071b25;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden}
  #game{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:#06131dcc;border:1px solid #ffffff30;border-radius:16px;padding:10px 18px;font-weight:800;box-shadow:0 8px 30px #0005}
  #score{font-size:26px;letter-spacing:2px} #help{position:fixed;left:14px;bottom:14px;max-width:340px;background:#06131dcc;border:1px solid #ffffff30;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
  #message{position:fixed;top:88px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(20px,4vw,38px);text-shadow:0 3px 12px #000;pointer-events:none;text-align:center}
  #reset{position:fixed;right:14px;bottom:14px;border:0;border-radius:12px;padding:12px 16px;background:#ffcc33;color:#15212a;font-weight:900;cursor:pointer}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#071b25;font-size:18px;z-index:5}
</style>
</head>
<body>
<div id="loading">3D-voetbalveld laden…</div>
<div id="hud"><span>⚽ MIJN VOETBALGAME</span><span id="score">0 - 0</span><span id="timer">01:30</span></div>
<div id="message">Scoor een goal!</div>
<div id="help"><b>Besturing</b><br>WASD of pijltjes = bewegen<br>Spatie = schieten (houd ingedrukt voor kracht)<br>Blauwe speler = jij · Rode keeper = tegenstander<br>Maak zoveel mogelijk goals voor de tijd om is!</div>
<button id="reset">Opnieuw spelen ↻</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const loading=document.getElementById('loading'), scoreEl=document.getElementById('score'), timerEl=document.getElementById('timer'), msg=document.getElementById('message');
if(!window.THREE){loading.textContent='De 3D-engine kon niet laden. Controleer je internetverbinding en ververs de pagina.';return;}
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x86d5ff); scene.fog=new THREE.Fog(0x86d5ff,35,85);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
camera.position.set(0,17,24); camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement); renderer.domElement.id='game';
scene.add(new THREE.HemisphereLight(0xffffff,0x47704a,2));
const sun=new THREE.DirectionalLight(0xffffff,2.3); sun.position.set(-10,22,12); sun.castShadow=true; scene.add(sun);
const mat=(c,rough=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const grass=mat(0x16843a), stripe1=mat(0x16843a), stripe2=mat(0x1b9344), white=mat(0xffffff), blue=mat(0x1677ff), red=mat(0xe73535), dark=mat(0x17212b), ballmat=mat(0xffffff,.35), black=mat(0x111820);
function box(w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;}
const field=box(22,.25,36,grass,0,-.18,0);
for(let i=0;i<9;i++) box(22,.012,4,stripe1,i%2?0:0,-.045,-16+i*4).material=stripe1;
for(let i=0;i<9;i++){const s=box(22,.014,2,stripe2,0,-.04,-16+i*4);s.position.y=-.04;}
function line(x1,z1,x2,z2){const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);const o=new THREE.Mesh(new THREE.BoxGeometry(.09,.025,len),white);o.position.set((x1+x2)/2,-.035,(z1+z2)/2);o.rotation.y=Math.atan2(dx,dz);scene.add(o);}
line(-10.7,-17,10.7,-17);line(-10.7,17,10.7,17);line(-10.7,-17,-10.7,17);line(10.7,-17,10.7,17);line(-10.7,0,10.7,0);
const circle=new THREE.Mesh(new THREE.TorusGeometry(3.1,.045,8,64),white);circle.rotation.x=Math.PI/2;circle.position.y=-.02;scene.add(circle);
function goal(z, facing){const w=6,h=2.6;box(w,.12,.14,white,0,h,z);box(.12,h,.14,white,-w/2,h/2,z);box(.12,h,.14,white,w/2,h/2,z);for(let i=0;i<=12;i++)lineGoal(-w/2+w*i/12,z,facing);for(let j=1;j<5;j++){const b=box(w,.025,.025,white,0,j*h/5,z+facing*.75);b.material=white;} }
function lineGoal(x,z,facing){const o=box(.025,2.6,.025,white,x,1.3,z+facing*.75);o.material=white;}
goal(-18,-1);goal(18,1);
function player(color,x,z){const g=new THREE.Group();scene.add(g);const body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,1.2,16),color);body.position.y=.9;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),mat(0xffd2a1));head.position.y=1.72;head.castShadow=true;g.add(head);const legmat=mat(0x202b3b);for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.65,10),legmat);leg.position.set(side*.22,.32,0);g.add(leg);}g.position.set(x,0,z);return g;}
const you=player(blue,0,9), keeper=player(red,0,-15);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),ballmat);ball.castShadow=true;scene.add(ball);
const patches=[];for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.49,6,4),black);p.scale.set(1,.12,1);p.position.y=.02;p.rotation.y=i*1.2;ball.add(p);}
const ballV=new THREE.Vector3(), keys={};let score=0,opp=0,time=90,shootHold=0,lastGoal=0,gameOver=false;
function resetBall(){ball.position.set(0,.5,5);ballV.set(0,0,0);you.position.set(0,0,9);keeper.position.set(0,0,-15);lastGoal=performance.now();}
resetBall();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shootHold=Math.min(shootHold+.06,1.4);}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space'&&!gameOver){const dx=ball.position.x-you.position.x,dz=ball.position.z-you.position.z;if(Math.hypot(dx,dz)<2.2){const power=8+shootHold*12;ballV.x+=(dx*.25);ballV.z=-power;}shootHold=0;}});
function restart(){score=0;opp=0;time=90;gameOver=false;scoreEl.textContent='0 - 0';timerEl.textContent='01:30';msg.textContent='Scoor een goal!';resetBall();lastTime=performance.now();}
document.getElementById('reset').onclick=restart;
let lastTime=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;
if(!gameOver){time-=dt;if(time<=0){time=0;gameOver=true;msg.textContent=score>opp?'JIJ WINT! 🏆':score<opp?'VOLGENDE KEER! ⚽':'GELIJKSPEL!';}
timerEl.textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')}`;
const move=new THREE.Vector3((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),0,(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0));if(move.length()>0){move.normalize().multiplyScalar(7*dt);you.position.add(move);you.rotation.y=Math.atan2(move.x,move.z);}
you.position.x=THREE.MathUtils.clamp(you.position.x,-9.7,9.7);you.position.z=THREE.MathUtils.clamp(you.position.z,-13,15);
const dx=ball.position.x-you.position.x,dz=ball.position.z-you.position.z,dist=Math.hypot(dx,dz);if(dist<1.25&&ball.position.y<1.7){ballV.x+=dx*.22;ballV.z+=dz*.22;}
keeper.position.x=THREE.MathUtils.clamp(ball.position.x*.7,-2.5,2.5);keeper.position.z=-15;
ballV.y-=16*dt;ball.position.addScaledVector(ballV,dt);if(ball.position.y<.48){ball.position.y=.48;ballV.y=Math.abs(ballV.y)*.48;if(Math.abs(ballV.y)<1)ballV.y=0;}
ballV.x*=Math.pow(.985,dt*60);ballV.z*=Math.pow(.99,dt*60);ball.rotation.x+=ballV.z*dt;ball.rotation.z-=ballV.x*dt;
if(Math.abs(ball.position.x)>10.3){ball.position.x=Math.sign(ball.position.x)*10.3;ballV.x*=-.65;}
if(ball.position.z>17.4&&Math.abs(ball.position.x)<3.2){score++;scoreEl.textContent=`${score} - ${opp}`;msg.textContent='GOOOOAL! ⚽🔥';resetBall();}else if(ball.position.z< -17.4&&Math.abs(ball.position.x)<3.2){opp++;scoreEl.textContent=`${score} - ${opp}`;msg.textContent='Tegenstander scoort!';resetBall();}else if(Math.abs(ball.position.z)>17.3){ball.position.z=Math.sign(ball.position.z)*17.3;ballV.z*=-.55;}
if(now-lastGoal>2200&&msg.textContent!=='Scoor een goal!'&&msg.textContent!=='JIJ WINT! 🏆'&&msg.textContent!=='VOLGENDE KEER! ⚽'&&msg.textContent!=='GELIJKSPEL! ⚽')msg.textContent='Scoor een goal!';
}
camera.position.x+=(you.position.x*.35-camera.position.x)*.035;camera.position.z+=(you.position.z+15-camera.position.z)*.035;camera.lookAt(you.position.x*.15,0,you.position.z-3);
renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loading.style.display='none';animate(performance.now());
})();
</script>
</body>
</html>
